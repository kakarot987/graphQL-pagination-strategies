<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphiQL IDE</title>

    <!-- Lock GraphiQL styles to a safe, pre-breaking version -->
    <link rel="stylesheet" href="https://unpkg.com/graphiql@3.0.6/graphiql.min.css" />
    <style>
        body { height: 100vh; margin: 0; overflow: hidden; }
        #graphiql { height: 100%; }
    </style>

    <!-- Load dependencies cleanly -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/graphiql@3.0.6/graphiql.min.js" crossorigin></script>
</head>
<body>

<div id="graphiql">Loading Playground...</div>

<script>
    const root = ReactDOM.createRoot(document.getElementById('graphiql'));
    const fetcher = GraphiQL.createFetcher({ url: '/graphql' });

    root.render(
      React.createElement(GraphiQL, {
        fetcher: fetcher,
        headerEditorEnabled: true,
        shouldPersistHeaders: true
      })
    );
</script>
</body>
</html>
