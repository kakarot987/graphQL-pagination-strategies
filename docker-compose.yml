services:
  graphql-pagination:
    build: .
    ports: ["8080:8080"]
    environment:
      SPRING_OUTPUT_ANSI_ENABLED: ALWAYS
    restart: on-failure

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: pagination
      POSTGRES_USER: pagination
      POSTGRES_PASSWORD: pagination
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagination -d pagination"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pagination-postgres-data:/var/lib/postgresql/data

  graphql-postgres:
    profiles: ["postgres"]
    build: .
    ports: ["8081:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/pagination
      DB_USER: pagination
      DB_PASSWORD: pagination
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pagination-postgres-data:
